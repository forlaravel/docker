name: Security rebuild - publish manifest

# Re-publishes the multi-arch tags from the per-arch images built by
# security-php-base.yml, without rebuilding.

on:
    push:
        branches:
            - 'security/php-*'
        paths:
            - '.github/workflows/security-php-manifest.yml'

env:
    PHP_MINOR: '8.4'
    VERSION_TAG: '1.3'

permissions:
    packages: write
    contents: read

jobs:
    create-manifest:
        name: Create manifest
        runs-on: ubuntu-latest
        steps:
            -   name: Log in to GitHub Container Registry
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Create and push multi-arch manifests
                run: |
                    IMAGE_BASE="ghcr.io/forlaravel/docker"
                    TAG_BASE="${VERSION_TAG}-php${PHP_MINOR}-fpm"
                    docker buildx imagetools create \
                        -t ${IMAGE_BASE}:${TAG_BASE} \
                        -t ${IMAGE_BASE}:latest-php${PHP_MINOR}-fpm \
                        ${IMAGE_BASE}:${TAG_BASE}-amd64 \
                        ${IMAGE_BASE}:${TAG_BASE}-arm64
                    docker buildx imagetools inspect ${IMAGE_BASE}:latest-php${PHP_MINOR}-fpm
